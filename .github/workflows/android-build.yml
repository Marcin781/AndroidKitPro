name: CyberAgent Android Build

on:
  push:
    paths:
      - 'cyberagent-android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'cyberagent-android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: cyberagent-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cyberagent-debug-apk
          path: cyberagent-android/app/build/outputs/apk/debug/app-debug.apk
